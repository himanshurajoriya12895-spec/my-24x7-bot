name: 24-7_MT5_Oracle
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest # Asli Windows PC chalu hoga
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Execute MT5 Script
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASS: ${{ secrets.MT5_PASS }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
